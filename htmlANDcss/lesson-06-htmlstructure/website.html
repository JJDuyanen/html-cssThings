<!DOCTYPE html> <!-- Tells the browser to use a modern version of HTML -->
<html> <!-- There's a webpage inside this element -->
  <head> <!-- <head>  contains everything that's  not visible  like  the title and descriptio
             (a.k.a. metadata) as well as links to fonts and CSS stylesheet-->
    <title>First Website</title>
  </head>
  <body> <!--<body> element contains all elements that are visible  like buttons,  text, images, etc-->
    <p>
      paragraph of text
    </p>

    <button>
      Hello
    </button>

    <a href="https://www.youtube.com/" target="blank">
      Link to YouTube
    </a>
  </body>
</html>
