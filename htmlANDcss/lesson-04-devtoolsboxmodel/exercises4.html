<style>
    .uber-button {
        background-color: black;
        color: white;
        border: none;
        cursor: pointer;
        transition: opacity 0.15s;
        padding-top: 12px;
        padding-bottom: 12px;
        padding-left: 15px;
        padding-right: 15px;
    }

    .uber-button:hover {
        opacity: 0.8;
    }
    
    .amazon-button {
        background-color: rgb(255, 216, 20);
        border: none;
        border-radius: 20px;
        padding-top: 7px;
        padding-bottom: 7px;
        padding-left: 35px;
        padding-right: 35px;
        border-radius: 15px;
        cursor: pointer;
    }

    .amazon-button:hover {
        background-color: rgb(245, 205, 3);
    }

    .github-button {
        background-color: rgb(46, 164, 79);
        border: none;
        color: white;
        font-weight: bold;
        padding-top: 12px;
        padding-bottom: 12px;
        padding-left: 17px;
        padding-right: 17px;
        border-radius: 5px;
        font-size: 15px;
        cursor: pointer;
        transition: box-shadow 0.15s;
    }

    .github-button:hover {
        box-shadow: 0px 5px 8px rgba(0, 0, 0, 0.15);
    }

    .bootstrap-button {
        background-color: rgb(121, 82, 179);
        color: white;
        border: none;
        padding-top: 12px;
        padding-bottom: 12px;
        padding-left: 20px;
        padding-right: 20px;
        border-radius: 4px;
        font-weight: bold;
        cursor: pointer;
        margin-right: 6px;
        transition: background-color 0.15s;
    }

    .bootstrap-button:hover {
        background-color: rgb(99, 60, 156);
    }

    .bootstrap-button1 {
        background-color: white;
        color: rgb(108, 117, 125);
        padding-top: 12px;
        padding-bottom: 12px;
        padding-left: 24px;
        padding-right: 24px;
        border-style: solid;
        border-width: 1px;
        border-color: rgb(108, 117, 125);
        border-radius: 4px;
        font-weight: bold;
        cursor: pointer;
        transition: background-color 0.15s,
            color 0.15s;
    }

    .bootstrap-button1:hover {
        background-color: rgb(108, 117, 125);
        color: white;
    }

    .linkedin-button {
        background-color: rgb(10, 102, 194);
        color: white;
        border: none;
        padding-top: 12px;
        padding-bottom: 12px;
        padding-left: 24px;
        padding-right: 24px;
        border-radius: 40px;
        font-weight: bold;
        font-size: 15px;
        cursor: pointer;
        margin-right: 8px;
        transition: background-color 0.15s;
    }

    .linkedin-button:hover {
        background-color: rgb(2, 70, 138);
    }

    .linkedin-button1 {
        background-color: white;
        color: rgb(10, 102, 194);
        padding-top: 12px;
        padding-bottom: 12px;
        padding-left: 24px;
        padding-right: 24px;
        border-style: solid;
        border-width: 1px;
        border-color: rgb(10, 102, 194);
        border-radius: 20px;
        font-weight: bold;
        font-size: 15px;
        cursor: pointer;
        transition: background-color 0.15s,
            border-width 0.15s;
    }

    .linkedin-button1:hover {
        background-color: rgb(226, 240, 254);
        border-width: 2px;
        padding-top: 11px;
        padding-bottom: 11px;
        padding-left: 23px;
        padding-right: 23px;
    }
</style>




<button class="uber-button">
    Request now
</button>

<br><br>

<button class="amazon-button">
    Add to Cart
</button>

<br><br>

<button class="github-button">
    Sign up
</button>

<br><br>

<button class="bootstrap-button">
    Get started
</button>

<button class="bootstrap-button1">
    Download
</button>

<br><br>

<button class="linkedin-button">
    Apply on company website
</button>

<button class="linkedin-button1">
    Save
</button>
